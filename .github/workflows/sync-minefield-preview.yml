name: sync-minefield-preview

on:
  push:
    branches:
      - feature/host-minefield-registry

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'build: sync hosted Minefield preview'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - name: Check out Minefield
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Blackwellboy/model-serving-minefield
          path: registry-src
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Render and sync
        run: |
          python3 build.py --registry registry-src --all
          mkdir -p minefield
          for f in index.html app.js styles.css registry-data.js; do
            cp "registry-src/web/$f" "minefield/$f"
          done

      - name: Commit generated site surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' minefield/index.html minefield/app.js minefield/styles.css minefield/registry-data.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: sync hosted Minefield preview"
          git push origin HEAD:feature/host-minefield-registry
