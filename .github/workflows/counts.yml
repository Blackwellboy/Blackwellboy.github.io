name: counts

# The site quotes figures describing a DIFFERENT repository: how many entries
# the registry holds, how many categories, how many outside contributors are
# credited. That repository moves fast enough that its own integrity README
# records the rule this job enforces: never write a bare count, always write
# the count and the tip it was counted at.
#
# So the page says "97 at 6808c48". This job checks that figure against the
# tree AT THAT COMMIT, which makes the check permanent: a page written when
# the count was 42 still passes today, because it said 42 at the commit where
# 42 was true.
#
# It FAILS only on a real error: a stated count that is wrong for the commit
# the page names, or a count with no commit beside it at all.
#
# It does NOT fail when the registry moves ahead. The page is still true, just
# older, and the reader was told which commit. Going red because somebody
# pushed to another repository would make this job habitually red, and a
# habitually red check teaches people to click through it. It prints a note
# with the refreshed numbers and the one-line edit instead.
#
# The daily schedule exists because the page can go out of date without anyone
# touching the page: the registry is what moves.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      # fetch-depth 0: the page may name a commit older than a shallow clone
      # reaches, and resolving it is the whole point of the check.
      #
      # The path MUST be inside the workspace. This step used to check out to
      # RUNNER_TEMP, reasoning that a registry file could then never be
      # mistaken for one belonging to this repo. actions/checkout rejects that
      # outright, with "Repository path ... is not under ...", and the step
      # failed on every run from the day it was added. The job went red, the
      # count check never executed at all, and the drift it exists to catch
      # (the page said 90 while the registry had moved to 97) went unreported
      # for exactly as long.
      #
      # Checking out inside the workspace is safe here for a reason worth
      # stating: this job publishes nothing. GitHub Pages deploys from a
      # separate "pages build and deployment" run that checks the repo out
      # fresh, so a directory created in THIS workspace cannot reach the
      # served site. _registry is gitignored as well, so it cannot be
      # committed by accident either.
      - name: Check out the registry it describes
        uses: actions/checkout@v4
        with:
          repository: Blackwellboy/model-serving-minefield
          path: _registry
          fetch-depth: 0

      # Fail loudly, and for the RIGHT reason. The previous failure was loud in
      # the sense that the job was red, but the red was read as "the counts
      # check is broken" rather than "the checkout never ran", and a check
      # nobody trusts is a check nobody reads. If the registry is not there,
      # say so in those words rather than letting check_counts.py report a
      # confusing git error about a directory that does not exist.
      - name: Confirm the registry checkout actually landed
        run: |
          if [ ! -d _registry/traps ]; then
            echo "::error title=counts::the registry checkout did not land."
            echo "_registry/traps is missing, so there is nothing to count"
            echo "against. This is a CI or checkout fault, NOT a wrong count"
            echo "on the page: do not edit index.html in response to it."
            ls -la _registry 2>/dev/null || echo "(_registry does not exist)"
            exit 1
          fi
          echo "registry present, entry files:"
          find _registry/traps -mindepth 2 -name '*.md' | wc -l

      - name: Verify every stated count against the commit the page names
        run: python3 check_counts.py --registry _registry
